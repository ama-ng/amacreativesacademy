<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMA Creatives Hausa Academy | Dashboard</title>
    <style>
        :root {
            --primary: #004d40;
            --accent: #d4af37;
            --glass: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #00241f, #004d40); color: var(--text); min-height: 100vh; }

        /* --- LOGIN PAGE --- */
        #auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card {
            background: var(--glass); backdrop-filter: blur(25px);
            padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            width: 100%; max-width: 420px; text-align: center;
        }
        input {
            width: 100%; padding: 14px; margin: 12px 0;
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass);
            border-radius: 10px; color: white; outline: none;
        }
        .btn {
            background: linear-gradient(45deg, var(--accent), #fcf6ba);
            color: #00241f; padding: 14px; border: none; border-radius: 10px;
            cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;
        }

        /* --- DASHBOARD --- */
        #dashboard { display: none; }
        nav {
            background: rgba(0,0,0,0.8); padding: 15px 5%; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass);
        }
        .container { padding: 30px 5%; max-width: 1200px; margin: auto; }
        .glass-panel {
            background: var(--glass); backdrop-filter: blur(15px);
            padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        /* --- VIDEO GRID --- */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        .video-card { background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; border: 1px solid var(--glass); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* --- GOLDEN ID CARD --- */
        .gold-id {
            width: 380px; min-height: 260px; background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728);
            border-radius: 15px; margin: 25px auto; color: #111; padding: 20px; text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .id-header { font-weight: 900; border-bottom: 2px solid rgba(0,0,0,0.2); padding-bottom: 5px; font-size: 1.2rem; }
        .id-sub-header { font-size: 0.85rem; font-weight: bold; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .id-content { display: flex; margin-top: 15px; gap: 15px; align-items: flex-start; }
        .id-photo-frame { width: 100px; height: 125px; border-radius: 8px; background: #fff; object-fit: cover; border: 2px solid #fff; }
        .id-details { text-align: left; font-size: 0.75rem; line-height: 1.4; font-weight: 700; flex: 1; }
        .id-divider { border-top: 1px solid rgba(0,0,0,0.15); margin: 8px 0; padding-top: 8px; }

        footer { text-align: center; padding: 40px; font-size: 0.85rem; opacity: 0.7; }

        @media print {
            body * { visibility: hidden; }
            #printableID, #printableID * { visibility: visible; }
            #printableID { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="auth-container">
        <div class="login-card">
            <h1 style="color: var(--accent);">AMA CREATIVES</h1>
            <p style="font-size: 0.8rem; margin-bottom: 20px;">Hausa Academy Portal</p>
            <input type="text" id="loginID" placeholder="ID Number">
            <input type="password" id="loginPass" placeholder="Password">
            <button class="btn" onclick="processLogin()">Shiga Karatu</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <nav>
            <span style="font-weight: bold; color: var(--accent); letter-spacing: 1px;">AMA GLOBAL INC.</span>
            <button onclick="location.reload()" style="background:none; border:1px solid var(--accent); color:var(--accent); padding:5px 15px; border-radius:5px; cursor:pointer;">Logout</button>
        </nav>

        <div class="container">
            <section class="glass-panel">
                <h2 id="student-name"></h2>
                <p id="course-access-info" style="color: var(--accent); margin-top: 5px;"></p>
            </section>

            <!-- VIDEOS -->
            <section id="courses">
                <h3 style="margin-bottom: 25px;">Darussan Ka (Video Lessons)</h3>
                <div class="video-grid" id="videoWrapper"></div>
            </section>

            <!-- ID CARD -->
            <section class="glass-panel" style="text-align: center;">
                <h3>Katin Shaida (Golden ID Card)</h3>
                <div class="gold-id" id="printableID">
                    <div class="id-header">AMA GLOBAL INC.</div>
                    <div class="id-sub-header">AMA Creatives Academy</div>
                    
                    <div class="id-content">
                        <img id="id-photo" src="" class="id-photo-frame">
                        <div class="id-details">
                            <p>NAME: <span id="id-name" style="color: #000;"></span></p>
                            <p>ID: <span id="id-num" style="color: #000;"></span></p>
                            <p>COHORT: <span id="id-cohort" style="color: #000;"></span></p>
                            
                            <div class="id-divider">
                                <p>LGA: <span id="id-lga" style="color: #000;"></span></p>
                                <p>STATE: <span id="id-state" style="color: #000;"></span></p>
                                <p>COUNTRY: <span id="id-country" style="color: #000;"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="btn" style="width: auto; padding: 10px 40px;" onclick="window.print()">Download ID Card</button>
            </section>

            <footer>
                <p>&copy; 2026 <strong>AMA Global Inc.</strong> All Rights Reserved.</p>
                <p style="font-size: 0.7rem; margin-top: 5px;">Developed by Arabo M. Auwal</p>
            </footer>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vToJbckEAiG7SfEMsbXsDg7CLUPDa9U9GQA0w-y1O27YEGimD2EnHomCZ89m3pnfLhaNSnwh5Vb08s5/pub?gid=2073621666&single=true&output=csv';

        // FULL VIDEO LIBRARY (V1 - V7)
        const videoLibrary = [
            { id: "v1", title: "Web App Hausa Episode 1", category: "web app", embed: "https://www.youtube.com/embed/7DumGWG-UFc?si=i-Oc12Q5GyHiD-Jh" },
            { id: "v2", title: "Web App Hausa Episode 2", category: "web app", embed: "https://www.youtube.com/embed/-et9KpjpVLI?si=MmzrBp0UCthYdJxj" },
            { id: "v3", title: "Web App Hausa Episode 3", category: "web app", embed: "https://www.youtube.com/embed/DEjHEXKkBDs?si=sgE2mYVrvGs2voOa" },
            { id: "v4", title: "Web App Hausa Episode 4", category: "web app", embed: "https://www.youtube.com/embed/jHxH0-8_ZCo?si=4T7l9MCEfcUJtyf9" },
            { id: "v5", title: "Web App Hausa Episode 5", category: "web app", embed: "https://www.youtube.com/embed/2xPN98_8JeQ?si=lMWm3-8HwB1i4u_y" },
            { id: "v6", title: "Web App Hausa Episode 6", category: "web app", embed: "https://www.youtube.com/embed/9m2yWGQPO2Q?si=8CD9bGNpuMBnx0dZ" },
            { id: "v7", title: "Web App Hausa Episode 7", category: "web app", embed: "https://www.youtube.com/embed/hJSTGSLcSnM?si=NbQxjZ7jEwcXQ_do" }
        ];

        async function processLogin() {
            const idInput = document.getElementById('loginID').value.trim();
            const passInput = document.getElementById('loginPass').value.trim();

            try {
                const res = await fetch(csvUrl);
                const text = await res.text();
                const rows = text.split(/\r?\n/).slice(1);

                for (let row of rows) {
                    const col = row.split(',').map(c => c.trim());
                    // Mapping based on your Google Sheet columns
                    if (col[3] === idInput && col[4] === passInput) {
                        launchDashboard({
                            passport: col[1], name: col[2], id: col[3], 
                            courses: col[6].toLowerCase(), cohort: col[7],
                            lga: col[8] || "N/A", state: col[9] || "N/A", country: col[10] || "Nigeria"
                        });
                        return;
                    }
                }
                alert("ID Number ko Password ba daidai ba!");
            } catch (e) { alert("An samu matsala wajen haɗuwa da rumbun bayanai."); }
        }

        function launchDashboard(user) {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            
            document.getElementById('student-name').innerText = "Barka da Zuwa, " + user.name;
            document.getElementById('course-access-info').innerText = "Course Registered: " + user.courses;
            
            // Populate ID Card
            document.getElementById('id-name').innerText = user.name;
            document.getElementById('id-num').innerText = user.id;
            document.getElementById('id-cohort').innerText = user.cohort;
            document.getElementById('id-photo').src = user.passport;
            document.getElementById('id-lga').innerText = user.lga;
            document.getElementById('id-state').innerText = user.state;
            document.getElementById('id-country').innerText = user.country;

            renderVideos(user.courses);
        }

        function renderVideos(userCourses) {
            const wrapper = document.getElementById('videoWrapper');
            wrapper.innerHTML = "";
            const tags = userCourses.split(',').map(t => t.trim().toLowerCase());

            videoLibrary.forEach(video => {
                if(tags.includes(video.category)) {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="video-container">
                            <iframe src="${video.embed}" allowfullscreen></iframe>
                        </div>
                        <div style="padding:15px; background: rgba(0,0,0,0.5);">
                            <h4 style="font-size: 0.9rem;">${video.title}</h4>
                        </div>
                    `;
                    wrapper.appendChild(card);
                }
            });
        }
    </script>
</body>
</html>
